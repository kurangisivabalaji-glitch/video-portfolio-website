<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="feBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="feSeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#be185d" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#180e1f" />
  
  <!-- Outer Ornate Border -->
  <rect x="25" y="25" width="950" height="650" rx="16" fill="none" stroke="url(#feBorder)" stroke-width="4" />
  <rect x="40" y="40" width="920" height="620" rx="12" fill="none" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1.5" />

  <!-- Corner Accents -->
  <path d="M 55 85 L 55 55 L 85 55" fill="none" stroke="#ec4899" stroke-width="3" />
  <path d="M 945 85 L 945 55 L 915 55" fill="none" stroke="#ec4899" stroke-width="3" />
  <path d="M 55 615 L 55 645 L 85 645" fill="none" stroke="#ec4899" stroke-width="3" />
  <path d="M 945 615 L 945 645 L 915 645" fill="none" stroke="#ec4899" stroke-width="3" />

  <!-- Header -->
  <text x="500" y="125" text-anchor="middle" font-family="'Segoe UI', Georgia, serif" font-size="20" letter-spacing="6" font-weight="600" fill="#f472b6">CERTIFICATE OF RECOGNITION</text>
  <text x="500" y="160" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" letter-spacing="3" fill="#cbd5e1">THIS CREDENTIAL HONORS</text>

  <!-- Name -->
  <text x="500" y="240" text-anchor="middle" font-family="'Segoe UI', Georgia, serif" font-size="40" font-weight="800" fill="#ffffff">K. Lakshmi Siva Balaji</text>
  <line x1="280" y1="265" x2="720" y2="265" stroke="url(#feBorder)" stroke-width="2" />

  <!-- Description -->
  <text x="500" y="320" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#cbd5e1">For exemplary performance and innovative frontend design execution in</text>
  <text x="500" y="365" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#f43f5e">Modern UI Architecture, React &amp; Tailwind Design</text>
  <text x="500" y="410" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" fill="#94a3b8">Interactive State Management, Component Architecture &amp; Glassmorphism Standards</text>

  <!-- Left Signer -->
  <g transform="translate(180, 500)">
    <line x1="0" y1="40" x2="200" y2="40" stroke="#475569" stroke-width="1.5" />
    <text x="100" y="25" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#f8fafc">Dept of Computer Science</text>
    <text x="100" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Sri Mittapalli Engg College</text>
  </g>

  <!-- Center Seal -->
  <g transform="translate(500, 520)">
    <circle cx="0" cy="0" r="46" fill="url(#feSeal)" filter="drop-shadow(0 0 10px rgba(244, 63, 94, 0.5))" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#ffe4e6" stroke-width="1.5" stroke-dasharray="3,2" />
    <text x="0" y="-8" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#ffffff">EXCELLENCE</text>
    <text x="0" y="8" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#ffffff">★ ★ ★</text>
    <text x="0" y="20" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#ffffff">VERIFIED</text>
  </g>

  <!-- Right Date -->
  <g transform="translate(620, 500)">
    <line x1="0" y1="40" x2="200" y2="40" stroke="#475569" stroke-width="1.5" />
    <text x="100" y="25" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#f8fafc">Year 2026</text>
    <text x="100" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">AUTHORIZED RECORD</text>
  </g>
</svg>
