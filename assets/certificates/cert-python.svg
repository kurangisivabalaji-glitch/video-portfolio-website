<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="pyBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="pySeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </radialGradient>
  </defs>

  <rect width="1000" height="700" fill="#0b1329" />
  
  <rect x="25" y="25" width="950" height="650" rx="16" fill="none" stroke="url(#pyBorder)" stroke-width="4" />
  <rect x="40" y="40" width="920" height="620" rx="12" fill="none" stroke="rgba(251, 191, 36, 0.3)" stroke-width="1.5" />

  <text x="500" y="125" text-anchor="middle" font-family="'Segoe UI', Georgia, serif" font-size="20" letter-spacing="6" font-weight="600" fill="#fbbf24">CERTIFICATE OF ACHIEVEMENT</text>
  <text x="500" y="160" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" letter-spacing="3" fill="#94a3b8">PRESENTED WITH PRIDE TO</text>

  <text x="500" y="240" text-anchor="middle" font-family="'Segoe UI', Georgia, serif" font-size="40" font-weight="800" fill="#f8fafc">K. Lakshmi Siva Balaji</text>
  <line x1="280" y1="265" x2="720" y2="265" stroke="url(#pyBorder)" stroke-width="2" />

  <text x="500" y="320" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#cbd5e1">In recognition of successful completion and rigorous coursework in</text>
  <text x="500" y="365" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#60a5fa">Python Core Programming &amp; Problem Solving</text>
  <text x="500" y="410" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" fill="#94a3b8">Data Structures, Algorithms, Functional Programming &amp; Logic Design</text>

  <g transform="translate(180, 500)">
    <line x1="0" y1="40" x2="200" y2="40" stroke="#475569" stroke-width="1.5" />
    <text x="100" y="25" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#f8fafc">Computer Science Dept</text>
    <text x="100" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748b">ORGANIZATION</text>
  </g>

  <g transform="translate(500, 520)">
    <circle cx="0" cy="0" r="46" fill="url(#pySeal)" filter="drop-shadow(0 0 10px rgba(59, 130, 246, 0.5))" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#dbeafe" stroke-width="1.5" stroke-dasharray="3,2" />
    <text x="0" y="-8" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#ffffff">CERTIFIED</text>
    <text x="0" y="8" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#fbbf24">★ ★ ★</text>
    <text x="0" y="20" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#ffffff">PYTHON</text>
  </g>

  <g transform="translate(620, 500)">
    <line x1="0" y1="40" x2="200" y2="40" stroke="#475569" stroke-width="1.5" />
    <text x="100" y="25" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#f8fafc">Academic Year 2025-26</text>
