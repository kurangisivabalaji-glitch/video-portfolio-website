<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="todoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="greenAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="todoCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.9)" />
      <stop offset="100%" stop-color="rgba(30, 41, 59, 0.7)" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#todoBg)" />
  <circle cx="200" cy="300" r="170" fill="#10b981" opacity="0.1" />

  <!-- Card -->
  <rect x="160" y="50" width="480" height="400" rx="20" fill="url(#todoCard)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" />

  <!-- Header -->
  <text x="200" y="95" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Sprint Task Manager</text>
  <rect x="520" y="78" width="85" height="24" rx="12" fill="rgba(16, 185, 129, 0.2)" />
  <text x="562" y="94" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#34d399">3 / 5 Done</text>

  <!-- Input Bar -->
  <rect x="200" y="118" width="310" height="38" rx="10" fill="rgba(2, 6, 23, 0.8)" stroke="rgba(148, 163, 184, 0.3)" stroke-width="1" />
  <text x="218" y="142" font-family="'Segoe UI', sans-serif" font-size="13" fill="#64748b">Add a new coding milestone...</text>
  <rect x="520" y="118" width="80" height="38" rx="10" fill="url(#greenAcc)" />
  <text x="560" y="142" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0f172a">+ Add</text>

  <!-- Task 1 (Completed) -->
  <rect x="200" y="175" width="400" height="50" rx="10" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
  <rect x="215" y="190" width="20" height="20" rx="6" fill="#10b981" />
  <path d="M220 200 L224 204 L231 195" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" />
  <text x="248" y="205" font-family="'Segoe UI', sans-serif" font-size="14" fill="#94a3b8" text-decoration="line-through">Build Portfolio Hero with Video Background</text>
  <rect x="530" y="188" width="55" height="22" rx="11" fill="rgba(56, 189, 248, 0.15)" />
  <text x="557" y="203" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#38bdf8">High</text>

  <!-- Task 2 (Completed) -->
  <rect x="200" y="235" width="400" height="50" rx="10" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
  <rect x="215" y="250" width="20" height="20" rx="6" fill="#10b981" />
  <path d="M220 260 L224 264 L231 255" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" />
  <text x="248" y="265" font-family="'Segoe UI', sans-serif" font-size="14" fill="#94a3b8" text-decoration="line-through">Create Skills Matrix (Strictly no Java)</text>
  <rect x="530" y="248" width="55" height="22" rx="11" fill="rgba(168, 85, 247, 0.15)" />
  <text x="557" y="263" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c084fc">Core</text>

  <!-- Task 3 (Active) -->
  <rect x="200" y="295" width="400" height="50" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
  <rect x="215" y="310" width="20" height="20" rx="6" fill="transparent" stroke="#38bdf8" stroke-width="1.8" />
  <text x="248" y="326" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Implement Certificate Lightbox with Zoom</text>
  <rect x="530" y="308" width="55" height="22" rx="11" fill="rgba(245, 158, 11, 0.15)" />
  <text x="557" y="323" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fbbf24">UI/UX</text>

  <!-- Task 4 (Active) -->
  <rect x="200" y="355" width="400" height="50" rx="10" fill="rgba(30, 41, 59, 0.4)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  <rect x="215" y="370" width="20" height="20" rx="6" fill="transparent" stroke="#64748b" stroke-width="1.5" />
  <text x="248" y="386" font-family="'Segoe UI', sans-serif" font-size="14" fill="#cbd5e1">Deploy on GitHub Pages &amp; Vercel</text>
  <rect x="530" y="368" width="55" height="22" rx="11" fill="rgba(148, 163, 184, 0.15)" />
  <text x="557" y="383" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">DevOps</text>
</svg>
