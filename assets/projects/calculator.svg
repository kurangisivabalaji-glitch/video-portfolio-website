<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="calcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="calcBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="opKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#calcBg)" />
  <circle cx="400" cy="250" r="190" fill="#06b6d4" opacity="0.1" />

  <!-- Calculator Frame -->
  <rect x="260" y="45" width="280" height="410" rx="24" fill="url(#calcBody)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />

  <!-- Display -->
  <rect x="280" y="70" width="240" height="85" rx="14" fill="#020617" stroke="rgba(255, 255, 255, 0.1)" />
  <text x="500" y="98" text-anchor="end" font-family="'Courier New', monospace" font-size="14" fill="#64748b">1,250 × 8.5</text>
  <text x="500" y="136" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#38bdf8">10,625</text>

  <!-- Keypad Grid (4 columns, 5 rows) -->
  <!-- Row 1: C, +/-, %, / -->
  <rect x="280" y="175" width="52" height="42" rx="10" fill="#334155" />
  <text x="306" y="201" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#f87171">C</text>

  <rect x="342" y="175" width="52" height="42" rx="10" fill="#334155" />
  <text x="368" y="201" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">±</text>

  <rect x="404" y="175" width="52" height="42" rx="10" fill="#334155" />
  <text x="430" y="201" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">%</text>

  <rect x="466" y="175" width="54" height="42" rx="10" fill="url(#opKey)" />
  <text x="493" y="201" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">÷</text>

  <!-- Row 2: 7, 8, 9, * -->
  <rect x="280" y="227" width="52" height="42" rx="10" fill="#1e293b" />
  <text x="306" y="253" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#f8fafc">7</text>

  <rect x="342" y="227" width="52" height="42" rx="10" fill="#1e293b" />
  <text x="368" y="253" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#f8fafc">8</text>

  <rect x="404" y="227" width="52" height="42" rx="10" fill="#1e293b" />
  <text x="430" y="253" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#f8fafc">9</text>

  <rect x="466" y="227" width="54" height="42" rx="10" fill="url(#opKey)" />
  <text x="493" y="253" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">×</text>

  <!-- Row 3: 4, 5, 6, - -->
  <rect x="280" y="279" width="52" height="42" rx="10" fill="#1e293b" />
  <text x="306" y="305" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#f8fafc">4</text>

  <rect x="342" y="279" width="52" height="42" rx="10" fill="#1e293b" />
  <text x="368" y="305" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#f8fafc">5</text>

  <rect x="404" y="279" width="52" height="42" rx="10" fill="#1e293b" />
  <text x="430" y="305" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#f8fafc">6</text>

  <rect x="466" y="279" width="54" height="42" rx="10" fill="url(#opKey)" />
  <text x="493" y="305" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">−</text>

  <!-- Row 4: 1, 2, 3, + -->
  <rect x="280" y="331" width="52" height="42" rx="10" fill="#1e293b" />
  <text x="306" y="357" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#f8fafc">1</text>

  <rect x="342" y="331" width="52" height="42" rx="10" fill="#1e293b" />
  <text x="368" y="357" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#f8fafc">2</text>

  <rect x="404" y="331" width="52" height="42" rx="10" fill="#1e293b" />
  <text x="430" y="357" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#f8fafc">3</text>

  <rect x="466" y="331" width="54" height="42" rx="10" fill="url(#opKey)" />
  <text x="493" y="357" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">+</text>

  <!-- Row 5: 0, ., = -->
  <rect x="280" y="383" width="114" height="42" rx="10" fill="#1e293b" />
  <text x="337" y="409" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#f8fafc">0</text>

  <rect x="404" y="383" width="52" height="42" rx="10" fill="#1e293b" />
  <text x="430" y="409" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#f8fafc">.</text>

  <rect x="466" y="383" width="54" height="42" rx="10" fill="url(#opKey)" />
  <text x="493" y="409" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">=</text>
</svg>
