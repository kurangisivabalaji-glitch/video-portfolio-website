<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="wBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="wCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.65)" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#wBg)" />
  <circle cx="600" cy="180" r="160" fill="#38bdf8" opacity="0.1" />

  <!-- Main Weather Dashboard Card -->
  <rect x="160" y="55" width="480" height="390" rx="22" fill="url(#wCard)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />

  <!-- Search bar -->
  <rect x="190" y="80" width="420" height="42" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
  <circle cx="215" cy="101" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="220" y1="106" x2="226" y2="112" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <text x="238" y="106" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">Search city (e.g. Kurichedu, Prakasam)...</text>

  <!-- Weather Hero Block -->
  <g transform="translate(190, 145)">
    <!-- Sun & Cloud Graphic -->
    <circle cx="70" cy="55" r="32" fill="url(#sunGrad)" />
    <path d="M55 75 A 25 25 0 0 1 95 60 A 20 20 0 0 1 125 75 A 15 15 0 0 1 120 95 L 45 95 A 15 15 0 0 1 55 75 Z" fill="#e2e8f0" opacity="0.9" />

    <text x="160" y="55" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Kurichedu, AP</text>
    <text x="160" y="76" font-family="'Segoe UI', sans-serif" font-size="14" fill="#94a3b8">Partly Cloudy • Humidity 62%</text>
    <text x="160" y="130" font-family="'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#38bdf8">29°C</text>
  </g>

  <!-- Metrics row (3 columns) -->
  <g transform="translate(190, 310)">
    <!-- Col 1 -->
    <rect x="0" y="0" width="130" height="95" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="65" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">WIND</text>
    <text x="65" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#f8fafc">14 km/h</text>
    <text x="65" y="80" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#38bdf8">East-North</text>

    <!-- Col 2 -->
    <rect x="145" y="0" width="130" height="95" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="210" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">PRESSURE</text>
    <text x="210" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#f8fafc">1012 hPa</text>
    <text x="210" y="80" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#34d399">Normal</text>

    <!-- Col 3 -->
    <rect x="290" y="0" width="130" height="95" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="355" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">UV INDEX</text>
    <text x="355" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#f8fafc">3.2</text>
    <text x="355" y="80" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fbbf24">Moderate</text>
  </g>
</svg>
