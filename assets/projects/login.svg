<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.7)" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  
  <!-- Cyber grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="400" cy="250" r="180" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="550" cy="180" r="120" fill="#818cf8" opacity="0.1" filter="url(#glow)" />

  <!-- Glass Card -->
  <rect x="230" y="65" width="340" height="370" rx="20" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" />

  <!-- Shield Icon with Glow -->
  <circle cx="400" cy="130" r="32" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="2" />
  <path d="M400 115 L415 122 V135 C415 145 400 152 400 152 C400 152 385 145 385 135 V122 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M394 133 L398 137 L407 128" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Card Title -->
  <text x="400" y="190" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Sign In</text>
  <text x="400" y="210" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Interactive Authentication UI</text>

  <!-- Input Field 1: Email -->
  <rect x="260" y="230" width="280" height="42" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1.2" />
  <circle cx="282" cy="251" r="5" fill="none" stroke="#64748b" stroke-width="1.5" />
  <text x="300" y="256" font-family="'Segoe UI', sans-serif" font-size="13" fill="#64748b">balaji@student.edu</text>

  <!-- Input Field 2: Password -->
  <rect x="260" y="285" width="280" height="42" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.2" />
  <text x="300" y="311" font-family="'Segoe UI', sans-serif" font-size="14" fill="#38bdf8">••••••••••••</text>
  <!-- Eye Icon -->
  <path d="M515 306 C515 306 522 301 527 306 C527 306 522 311 515 306 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="521" cy="306" r="2" fill="#38bdf8" />

  <!-- Button -->
  <rect x="260" y="348" width="280" height="44" rx="10" fill="url(#accentGrad)" />
  <text x="400" y="375" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0f172a">Authenticate</text>

  <!-- Badge / Tags -->
  <rect x="40" y="40" width="130" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
  <text x="105" y="61" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Project #1</text>
</svg>
