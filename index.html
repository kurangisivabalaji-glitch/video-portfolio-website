<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Siva Balaji - Full Stack Developer Portfolio. Modern responsive web applications, React.js, Node.js, JavaScript, and Python.">
  <title>Siva Balaji — Full Stack Developer</title>

  <!-- Google Fonts: Syne (Ultra bold luxury), Inter (Clean editorial), JetBrains Mono, Caveat (Handwritten) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#FF2A2A',
              redHover: '#E01E1E',
              dark: '#111111',
              darker: '#0a0a0a',
              cardDark: '#1c1c1c',
              textMuted: '#A3A3A3',
            }
          },
          fontFamily: {
            syne: ['Syne', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            hand: ['Caveat', 'cursive'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel for standalone JSX execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase 10 SDKs (Compat UMD for seamless standalone browser execution) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-analytics-compat.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#111111] text-white selection:bg-[#FF2A2A] selection:text-white antialiased overflow-x-hidden">
  
  <!-- Root React Container -->
  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel" src="app.js"></script>
</body>
</html>
